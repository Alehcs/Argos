name: Build and test

on:
  push:
    branches: ['**']
    # Notes and documents only: nothing to build.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going (Windows minutes count double on private repositories).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Argos.sln -c Release -p:Platform=x64 --nologo

      # Tests that need what this runner lacks (OBS Studio's FFmpeg, the captions engine) are skipped; any other failure
      # fails the run.
      - name: Tests
        timeout-minutes: 25
        shell: pwsh
        run: |
          # No arguments after the project options: dotnet run hands unknown ones to the test runner as a name filter.
          dotnet run --project tests/Argos.Tests -c Release --property:Platform=x64 2>&1 | Tee-Object -FilePath test-results.txt
          exit $LASTEXITCODE

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $lines = if (Test-Path test-results.txt) { Get-Content test-results.txt } else { @('The tests did not run.') }
          $failed = @($lines | Where-Object { $_ -like 'FAIL *' })
          $summary = @('## Tests', '', ($lines | Select-Object -Last 1))
          if ($failed.Count -gt 0) { $summary += @('', "### Failed ($($failed.Count))", '', '```') + $failed + @('```') }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # A run that found no tests at all is a broken setup, not a pass.
          if (-not ($lines | Where-Object { $_ -match '^(PASS|FAIL) ' })) { Write-Output '::error::No tests ran'; exit 1 }

      # The release publishes the program compiled ahead of time (ReadyToRun), with the developer switches off
      # (PublicRelease): make sure that still builds.
      - name: Publish as a release does
        shell: pwsh
        run: |
          dotnet publish src/Argos -c Release --self-contained true -p:PublicRelease=true -o publish --nologo
          $mb = (Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "Published program: {0:N1} MB" -f $mb | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The published program (compiled ahead of time) runs: the share panel's publishing on local mock pages, then the
      # engine itself, asked for its status and to exit. Without OBS on this runner the engine starts with an error
      # instead of recording, which is enough to see it start, answer and close.
      - name: Smoke test the published program
        timeout-minutes: 8
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/Argos.exe).Path
          function Invoke-Argos([string[]] $arguments) {
              $p = Start-Process $exe -ArgumentList $arguments -NoNewWindow -Wait -PassThru -RedirectStandardOutput argos-out.txt
              [pscustomobject]@{ Code = $p.ExitCode; Text = (Get-Content argos-out.txt -Raw) }
          }

          $share = Invoke-Argos @('--selftest-share-site', (Resolve-Path tests/Argos.Tests/Fixtures/Share/clip-h264.mp4).Path)
          $share.Text
          if ($share.Code -ne 0) { throw "share self-test: $($share.Code) failed" }

          # A public release ignores the developer switches: ARGOS_DATA must not move its settings folder.
          $env:ARGOS_DATA = Join-Path $env:RUNNER_TEMP 'argos-dev-data'
          $engine = Start-Process $exe -ArgumentList '--background' -PassThru
          $null = $engine.Handle # keeps the exit code readable once it ends
          $status = $null
          for ($i = 0; $i -lt 30 -and -not $status; $i++) {
              Start-Sleep -Seconds 1
              $reply = (Invoke-Argos @('--send', 'status')).Text
              if ($reply -match '"version"') { $status = $reply }
          }
          if (-not $status) { Get-Content "$env:APPDATA/Argos/logs/argos-*.log" -Tail 40; throw 'the engine did not answer' }
          "engine status: $($status.Substring(0, [Math]::Min(300, $status.Length)))"
          Invoke-Argos @('--send', 'exit') | Out-Null
          if (-not $engine.WaitForExit(30000)) { $engine.Kill(); throw 'the engine did not exit' }
          if ($engine.ExitCode -ne 0) { throw "the engine exited with code $($engine.ExitCode)" }
          'engine: started, answered and closed'
          if (Test-Path $env:ARGOS_DATA) { throw 'the public release followed ARGOS_DATA' }
          if (-not (Test-Path "$env:APPDATA/Argos/logs")) { throw 'the engine kept no log in %APPDATA%\Argos' }
          Remove-Item Env:ARGOS_DATA
          'public release: developer switches off'

      # Pictures of the main pages (the "pages" artifact), to look at a change without a Windows PC.
      - name: Render pages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pages | Out-Null
          $exe = (Resolve-Path publish/Argos.exe).Path
          $renders = @(
              @('quality', 'en', ''), @('quality', 'ar', ''), @('quality', 'en', 'performance'), @('quality', 'es', 'performance'),
              @('capture', 'es', 'performance'), @('status', 'en', 'losing-frames'), @('status', 'es', 'losing-frames'))
          foreach ($r in $renders) {
              $png = Join-Path $PWD ("pages/{0}-{1}{2}.png" -f $r[0], $r[1], $(if ($r[2]) { '-' + $r[2] } else { '' }))
              $arguments = @('--render', $r[0], $png, $r[1]) + $(if ($r[2]) { @($r[2]) } else { @() })
              $p = Start-Process $exe -ArgumentList $arguments -NoNewWindow -Wait -PassThru
              if ($p.ExitCode -ne 0 -or -not (Test-Path $png)) { throw "render $($r -join ' ') failed ($($p.ExitCode))" }
              Split-Path $png -Leaf
          }
          $tray = Join-Path $PWD 'pages/tray.png'
          $p = Start-Process $exe -ArgumentList @('--render-tray', $tray) -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $tray)) { throw "render tray failed ($($p.ExitCode))" }
          Split-Path $tray -Leaf

      - name: Keep the page pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: pages/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
          if-no-files-found: ignore
          retention-days: 7
