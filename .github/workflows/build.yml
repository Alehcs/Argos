name: Build and test

on:
  push:
    branches: ['**']
    # Notes and documents only: nothing to build.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going (Windows minutes count double on private repositories).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Argos.sln -c Release -p:Platform=x64 --nologo

      # Tests that need what this runner lacks (OBS Studio's FFmpeg, the captions engine) are skipped; any other failure
      # fails the run.
      - name: Tests
        timeout-minutes: 25
        shell: pwsh
        run: |
          # No arguments after the project options: dotnet run hands unknown ones to the test runner as a name filter.
          dotnet run --project tests/Argos.Tests -c Release --property:Platform=x64 2>&1 | Tee-Object -FilePath test-results.txt
          exit $LASTEXITCODE

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $lines = if (Test-Path test-results.txt) { Get-Content test-results.txt } else { @('The tests did not run.') }
          $failed = @($lines | Where-Object { $_ -like 'FAIL *' })
          $summary = @('## Tests', '', ($lines | Select-Object -Last 1))
          if ($failed.Count -gt 0) { $summary += @('', "### Failed ($($failed.Count))", '', '```') + $failed + @('```') }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # A run that found no tests at all is a broken setup, not a pass.
          if (-not ($lines | Where-Object { $_ -match '^(PASS|FAIL) ' })) { Write-Output '::error::No tests ran'; exit 1 }

      # The release publishes the program compiled ahead of time (ReadyToRun): make sure that still builds.
      - name: Publish as a release does
        shell: pwsh
        run: |
          dotnet publish src/Argos -c Release --self-contained true -o publish --nologo
          dotnet publish src/Argos -c Release --self-contained true -o publish-jit -p:PublishReadyToRun=false --nologo
          foreach ($dir in 'publish', 'publish-jit') {
              $mb = (Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
              $dll = (Get-Item "$dir/Argos.dll").Length / 1MB
              "{0}: {1:N1} MB in all, Argos.dll {2:N1} MB" -f $dir, $mb, $dll | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
          if-no-files-found: ignore
          retention-days: 7
